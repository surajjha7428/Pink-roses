<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rosette – Pink Rose Bouquets</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff3f6;--ink:#4a1d2e;--muted:#8a5b6c;--panel:#fff;--rose:#e8458a;--deep:#b02a63;--line:#f3c9d6;--halo:#ffd9e5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#26101a;--ink:#ffe6ee;--muted:#d7a3b6;--panel:#38162a;--rose:#f2679f;--deep:#ff9bbb;--line:#5a2438;--halo:#4a1c30}}
:root[data-theme="dark"]{--bg:#26101a;--ink:#ffe6ee;--muted:#d7a3b6;--panel:#38162a;--rose:#f2679f;--deep:#ff9bbb;--line:#5a2438;--halo:#4a1c30}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;line-height:1.6}
header{max-width:1080px;margin:0 auto;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}
.brand{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:1.5rem;color:var(--deep)}
header span{color:var(--muted);font-size:.9rem}
main{max-width:1080px;margin:0 auto;padding:8px 20px 40px;display:grid;grid-template-columns:5fr 6fr;gap:28px;align-items:center}
h1{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:clamp(2.2rem,5vw,3.5rem);line-height:1.05;margin:0 0 12px;color:var(--deep)}
p.lead{margin:0 0 22px;color:var(--muted);max-width:42ch}
:focus-visible{outline:3px solid var(--deep)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:16px}
label,.lbl{font-weight:700;font-size:.95rem;display:flex;justify-content:space-between;gap:8px}
input[type=range]{width:100%;accent-color:var(--rose)}
input[type=text]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.sw{display:flex;gap:10px;margin-top:8px}
.sw button{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer;outline-offset:3px;box-shadow:0 0 0 1px var(--line)}
.sw button[aria-pressed=true]{border-color:var(--ink)}
.btn{background:var(--rose);color:#fff;border:0;border-radius:999px;padding:12px 22px;font:700 1rem Nunito,sans-serif;cursor:pointer;justify-self:start}
.btn:hover{background:var(--deep)}
.stage{position:relative;border-radius:32px;background:radial-gradient(circle at 50% 38%,var(--halo),transparent 70%)}
svg{width:100%;height:auto;display:block;cursor:pointer}
.card{position:absolute;right:4%;bottom:8%;max-width:38%;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-family:Fraunces,Georgia,serif;font-size:.95rem;transform:rotate(4deg);box-shadow:0 6px 14px rgba(120,30,60,.18)}
.card small{display:block;color:var(--muted);font-family:Nunito,sans-serif;margin-top:4px}
.bloom{transform-box:fill-box;transform-origin:center}
.grow .bloom{animation:bloom .7s cubic-bezier(.2,1.3,.4,1) both}
@keyframes bloom{from{transform:scale(0)}to{transform:scale(1)}}
#bouquet{transform-origin:300px 690px;animation:sway 6s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-1deg)}to{transform:rotate(1deg)}}
@media(prefers-reduced-motion:reduce){#bouquet,.grow .bloom{animation:none}}
@media(max-width:800px){main{grid-template-columns:1fr}.stage{order:-1}}
</style>
</head>
<body>
<header><div class="brand">Rosette</div><span>Hand-tied pink roses</span></header>
<main>
  <section>
    <h1>A bouquet of nothing but pink roses</h1>
    <p class="lead">Light blush to deep hot pink, wrapped in white tissue with a satin bow. Tap the bouquet to rearrange the roses.</p>
    <div class="panel">
      <div>
        <label for="count"><span>Number of roses</span><span id="countOut"></span></label>
        <input id="count" type="range" min="12" max="50">
      </div>
      <div>
        <div class="lbl">Wrapping paper</div>
        <div class="sw" id="wraps"></div>
      </div>
      <button class="btn" id="shuffle" type="button">Rearrange the roses</button>
    </div>
    </section>
  <section class="stage">
    <svg id="svg" viewBox="0 0 600 700" role="img" aria-label="Round bouquet of pink roses with white tissue and a pink ribbon"><g id="bouquet"></g></svg>
    <div class="card"><span id="cardText">Thinking of you.</span><small id="cardFrom"></small></div>
  </section>
</main>
<script>
// ===== Default settings (note and from text are set here only) =====
const CONFIG={
  roses:30,            // number of roses (12 to 50)
  note:'Thinking of you.',
  from:'With love',
  wrap:'Cream',        // Cream, Blush or Mauve
  seed:11              // change this number for a different arrangement
};
// ===============================
const PAL=[
 ['#fde3ec','#fbc4d6','#f79dba','#e2739d','#b04070'],
 ['#fbc4d6','#f79dba','#ee6a9a','#d94a7c','#a82c5a'],
 ['#f98bb4','#ef5f96','#e63a7c','#c42263','#8f1448']];
const WRAPS=[['Cream','#e6d6bd'],['Blush','#f2c3d1'],['Mauve','#8e5a78']];
let seed=CONFIG.seed; let wrap=(WRAPS.find(w=>w[0]===CONFIG.wrap)||WRAPS[0])[1];
const $=id=>document.getElementById(id);
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

function rose(r,rnd,p){
  const rings=[[7,.62,.5,0],[6,.42,.4,1],[5,.26,.3,2],[3,.1,.2,3]];
  let s=`<g transform="rotate(${rnd()*360})"><circle r="${r}" fill="${p[2]}" stroke="${p[4]}" stroke-opacity=".4"/>`;
  rings.forEach(([n,d,sz,c],k)=>{
    for(let i=0;i<n;i++){
      s+=`<ellipse cx="0" cy="${-d*r}" rx="${sz*r}" ry="${sz*r*.9}" transform="rotate(${i*360/n+k*19})" fill="${p[(c+i%2)%5]}" stroke="${p[4]}" stroke-opacity=".35" stroke-width="1"/>`;
    }
  });
  return s+`<path d="M${-r*.08} 0 q${r*.08} ${-r*.14} ${r*.18} 0" stroke="${p[4]}" stroke-width="1.5" fill="none"/></g>`;
}

function build(){
  const n=+$('count').value, rnd=rng(seed), cx=300, cy=235, RX=168, RY=140, T=Math.PI*2;
  let svg='';
  // cream outer wrap
  svg+=`<path d="M120 330 Q300 440 480 330 L352 556 L372 668 L228 668 L248 556Z" fill="${wrap}" stroke="#0002"/>
  <path d="M300 420 L480 330 L352 556 L372 668 L300 668Z" fill="#fff" opacity=".2"/>
  <path d="M120 330 L300 420 L300 668 L228 668 L248 556Z" fill="#000" opacity=".07"/>
  <path d="M205 395 L268 560 M395 395 L332 560" stroke="#0002" fill="none"/>
  <ellipse cx="300" cy="668" rx="72" ry="8" fill="#0003"/>`;
  // white tissue ruffles
  for(let k=0;k<15;k++){
    const a=-.2*Math.PI+k/14*1.4*Math.PI, x=cx+Math.cos(a)*RX*1.02, y=cy+Math.sin(a)*RY*1.05+12, rot=a*180/Math.PI+90;
    svg+=`<ellipse cx="${x}" cy="${y}" rx="62" ry="30" transform="rotate(${rot} ${x} ${y})" fill="#fff" stroke="#cfc7cc"/>
    <ellipse cx="${cx+(x-cx)*.86}" cy="${cy+(y-cy)*.86}" rx="50" ry="22" transform="rotate(${rot} ${cx+(x-cx)*.86} ${cy+(y-cy)*.86})" fill="#f4eef2" stroke="#e1d9de"/>`;
  }
  // dark green leaves
  for(let i=0;i<18;i++){
    const a=i/18*T+rnd()*.2, x=cx+Math.cos(a)*RX*.98, y=cy+Math.sin(a)*RY*.98, L=58+rnd()*24;
    svg+=`<g transform="translate(${x} ${y}) rotate(${a*180/Math.PI+90})"><path d="M0 0 Q${-L*.38} ${-L*.5} 0 ${-L} Q${L*.38} ${-L*.5} 0 0Z" fill="${i%2?'#1f3d2b':'#2b5238'}"/><path d="M0 0 L0 ${-L*.9}" stroke="#14281c" stroke-width="1.5"/></g>`;
  }
  // roses
  const items=[];
  for(let i=0;i<n;i++){
    const rad=Math.sqrt((i+.5)/n), th=i*2.39996+seed;
    const r=Math.min(46,(1.2*RX/Math.sqrt(n))*(1-.18*rad*rad))+rnd()*3;
    items.push({x:cx+Math.cos(th)*rad*(RX-r*.6),y:cy+Math.sin(th)*rad*(RY-r*.6),r,p:PAL[Math.floor(rnd()*3)]});
  }
  items.sort((a,b)=>a.y-b.y);
  items.forEach((o,i)=>{svg+=`<g transform="translate(${o.x} ${o.y})"><g class="bloom" style="animation-delay:${i*35}ms">${rose(o.r,rnd,o.p)}</g></g>`});
  // baby's breath filler
  for(let i=0;i<20;i++){
    const a=rnd()*T, d=.8+rnd()*.35, x=cx+Math.cos(a)*RX*d, y=cy+Math.sin(a)*RY*d;
    if(y>cy+RY*.6) continue;
    for(let j=0;j<7;j++){
      const px=x+(rnd()-.5)*34, py=y+(rnd()-.5)*34;
      svg+=`<path d="M${x} ${y} L${px} ${py}" stroke="#9a86b8" stroke-opacity=".5" stroke-width=".8"/><circle cx="${px}" cy="${py}" r="${2+rnd()*2}" fill="${j%2?'#cdb4e8':'#f9c9e2'}"/>`;
    }
  }
  // satin ribbon bow
  svg+=`<path d="M296 566 Q270 610 246 660 L266 664 Q292 620 304 570Z" fill="#f7a8c5"/>
  <path d="M304 566 Q330 600 352 650 L334 658 Q312 618 296 572Z" fill="#f48fb4"/>
  <path d="M246 546 Q300 566 354 546 L352 566 Q300 586 248 566Z" fill="#f7a8c5"/>
  <path d="M300 558 C238 515 222 578 285 568Z" fill="#f7a8c5" stroke="#e57aa3"/>
  <path d="M300 558 C362 515 378 578 315 568Z" fill="#f48fb4" stroke="#e57aa3"/>
  <circle cx="300" cy="561" r="9" fill="#ee7aa6"/>`;
  $('bouquet').innerHTML=svg;
  $('countOut').textContent=n;
  const el=$('svg'); el.classList.remove('grow'); void el.getBoundingClientRect(); el.classList.add('grow');
}

$('count').value=CONFIG.roses;
$('cardText').textContent=CONFIG.note;
$('cardFrom').textContent=CONFIG.from;
WRAPS.forEach(([name,c])=>{
  const b=document.createElement('button');
  b.type='button';b.style.background=c;b.setAttribute('aria-label',name+' wrapping');b.setAttribute('aria-pressed',name===CONFIG.wrap);
  b.onclick=()=>{wrap=c;[...$('wraps').children].forEach(x=>x.setAttribute('aria-pressed',x===b));build()};
  $('wraps').appendChild(b);
});
$('count').oninput=build;
const shuffle=()=>{seed=Math.floor(Math.random()*9999)+1;build()};
$('shuffle').onclick=shuffle;
$('svg').onclick=shuffle;
build();
</script>
</body>
</html>
